name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust (mise)
        uses: jdx/mise-action@v5
        with:
          install_args: rust
      - name: Run Rust core tests
        run: |
          cd ext/chrono_machines_native/core
          cargo test --all-features
      - name: Run Rust doc tests
        run: |
          cd ext/chrono_machines_native/core
          cargo test --doc

  test-no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust (mise)
        uses: jdx/mise-action@v5
        with:
          install_args: rust
      - name: Build pure no_std (bare metal)
        run: cargo build --no-default-features --target thumbv7em-none-eabihf
        working-directory: ext/chrono_machines_native/core
      - name: Build no_std + alloc (bare metal)
        run: cargo build --no-default-features --features alloc --target thumbv7em-none-eabihf
        working-directory: ext/chrono_machines_native/core
      - name: Clippy (no_std + alloc)
        run: cargo clippy --no-default-features --features alloc --target thumbv7em-none-eabihf -- -D warnings
        working-directory: ext/chrono_machines_native/core

  test-mri:
    needs: test-rust
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['4.0']
    env:
      MISE_RUBY_VERSION: ${{ matrix.ruby-version }}
      BUNDLE_PATH: vendor/bundle
    steps:
      - uses: actions/checkout@v7
      - name: Set up toolchain (mise)
        uses: jdx/mise-action@v5
      - name: Cache gems
        uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ matrix.ruby-version }}-${{ hashFiles('Gemfile', '*.gemspec') }}

      - name: Install gems
        run: bundle install --jobs 4
      - name: Run tests
        run: bundle exec rake test

  test-jvm-rubies:
    runs-on: ubuntu-latest
    needs: test-mri
    strategy:
      matrix:
        ruby-version: ['jruby-10.1.2.0', 'truffleruby-40.0.0']
    env:
      BUNDLE_PATH: vendor/bundle
    steps:
      - uses: actions/checkout@v7
      - name: Set up toolchain (mise)
        uses: jdx/mise-action@v5
        with:
          mise_toml: |
            [tools]
            ruby = "${{ matrix.ruby-version }}"
            ${{ startsWith(matrix.ruby-version, 'jruby') && 'java = "temurin-21"' || '' }}
      - name: Cache gems
        uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ matrix.ruby-version }}-${{ hashFiles('Gemfile', '*.gemspec') }}

      - name: Install gems
        run: bundle install --jobs 4
      - name: Run tests
        run: bundle exec rake test
