[package]
name = "chrono-machines"
version = "0.13.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors = ["Abdelkader Boudih <terminale@gmail.com>"]
description = "Exponential, constant and Fibonacci backoff with jitter over caller-supplied draws: no_std, allocation-free, no clock"
repository = "https://github.com/seuros/chrono_machines"
keywords = ["retry", "backoff", "exponential", "jitter", "no-std"]
categories = ["no-std", "algorithms"]
readme = "README.md"
exclude = ["src/**/tests.rs", "src/tests/", "tests/"]

[dev-dependencies]
matryona-machines = { workspace = true, features = ["testing"] }

[lints]
workspace = true
